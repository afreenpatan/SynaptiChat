<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SynaptiChat</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81
                );

            color: white;

            padding: 20px;
        }


        .signup-container {

            width: 100%;
            max-width: 430px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        .signup-logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            font-size: 35px;
        }


        h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .signup-subtitle {

            text-align: center;

            color: #cbd5e1;

            font-size: 14px;

            margin-bottom: 28px;
        }


        .input-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.18);

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 14px;

            outline: none;
        }


        input::placeholder {

            color: #94a3b8;
        }


        input:focus {

            border-color: #818cf8;

            box-shadow:
                0 0 0 3px rgba(129, 140, 248, 0.15);
        }


        .password-container {

            position: relative;
        }


        .password-container input {

            padding-right: 48px;
        }


        .password-toggle {

            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: white;

            cursor: pointer;

            font-size: 18px;
        }


        .password-requirements {

            margin: 8px 0 20px;

            padding: 12px 14px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.05);

            color: #cbd5e1;

            font-size: 12px;

            line-height: 1.8;
        }


        .password-requirements p {

            color: white;

            font-weight: 600;

            margin-bottom: 3px;
        }


        .signup-error {

            min-height: 20px;

            margin-bottom: 12px;

            text-align: center;

            color: #fca5a5;

            font-size: 13px;
        }


        .signup-success {

            min-height: 20px;

            margin-bottom: 12px;

            text-align: center;

            color: #86efac;

            font-size: 13px;
        }


        .signup-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .signup-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.3);
        }


        .signup-button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        .login-text {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #cbd5e1;
        }


        .login-text a {

            color: #a5b4fc;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        .back-home {

            text-align: center;

            margin-top: 18px;
        }


        .back-home a {

            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }


        .back-home a:hover {

            color: white;
        }


        .signup-footer {

            margin-top: 25px;

            text-align: center;

            color: #64748b;

            font-size: 11px;

            letter-spacing: 0.5px;
        }

    </style>

</head>


<body>


    <div class="signup-container">


        <!-- Logo -->

        <div class="signup-logo">
            🧠
        </div>


        <!-- Heading -->

        <h1>Create Account</h1>


        <p class="signup-subtitle">
            Join <strong>SynaptiChat</strong> and get started
        </p>


        <!-- Signup Form -->

        <form id="signupForm">


            <!-- Name -->

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email ID
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show or hide password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show or hide password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Password Requirements -->

            <div class="password-requirements">

                <p>Password must contain:</p>

                <div id="length">
                    ○ At least 8 characters
                </div>

                <div id="uppercase">
                    ○ One uppercase letter
                </div>

                <div id="number">
                    ○ One number
                </div>

                <div id="special">
                    ○ One special character
                </div>

            </div>


            <!-- Messages -->

            <div
                id="signupError"
                class="signup-error"
                role="alert"
            ></div>


            <div
                id="signupSuccess"
                class="signup-success"
                role="status"
            ></div>


            <!-- Create Account -->

            <button
                type="submit"
                class="signup-button"
                id="signupButton"
            >
                ✨ Create Account
            </button>


        </form>


        <!-- Login -->

        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- Back -->

        <div class="back-home">

            <a href="index.html">
                ← Back to SynaptiChat
            </a>

        </div>


        <!-- Footer -->

        <div class="signup-footer">

            SynaptiChat • NLP • AI • Machine Learning

        </div>


    </div>


    <!-- Supabase JavaScript Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // ===============================
        // PASSWORD ELEMENTS
        // ===============================

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");


        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");


        // ===============================
        // SHOW / HIDE PASSWORD
        // ===============================

        togglePassword.addEventListener("click", () => {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "👁";

            }

        });


        toggleConfirmPassword.addEventListener("click", () => {

            if (confirmPasswordInput.type === "password") {

                confirmPasswordInput.type = "text";

                toggleConfirmPassword.textContent = "🙈";

            } else {

                confirmPasswordInput.type = "password";

                toggleConfirmPassword.textContent = "👁";

            }

        });


        // ===============================
        // PASSWORD REQUIREMENTS
        // ===============================

        passwordInput.addEventListener("input", () => {

            const password =
                passwordInput.value;


            document.getElementById("length").textContent =
                password.length >= 8
                    ? "✓ At least 8 characters"
                    : "○ At least 8 characters";


            document.getElementById("uppercase").textContent =
                /[A-Z]/.test(password)
                    ? "✓ One uppercase letter"
                    : "○ One uppercase letter";


            document.getElementById("number").textContent =
                /[0-9]/.test(password)
                    ? "✓ One number"
                    : "○ One number";


            document.getElementById("special").textContent =
                /[^A-Za-z0-9]/.test(password)
                    ? "✓ One special character"
                    : "○ One special character";

        });


        // ===============================
        // SUPABASE CONFIGURATION
        // ===============================

        const SUPABASE_URL =
            "https://ncmzxckwmqxeedgvnnur.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_aPG_CYVW5l8p9XHxBkZegw_P_AVSQSl";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ===============================
        // CREATE ACCOUNT
        // ===============================

        document.getElementById("signupForm")
            .addEventListener("submit", async (event) => {

                event.preventDefault();


                // ===============================
                // GET FORM VALUES
                // ===============================

                const name =
                    document.getElementById("name")
                        .value
                        .trim();


                const email =
                    document.getElementById("email")
                        .value
                        .trim();


                const password =
                    document.getElementById("password")
                        .value;


                const confirmPassword =
                    document.getElementById("confirmPassword")
                        .value;


                const errorMessage =
                    document.getElementById("signupError");


                const successMessage =
                    document.getElementById("signupSuccess");


                const signupButton =
                    document.getElementById("signupButton");


                // ===============================
                // CLEAR OLD MESSAGES
                // ===============================

                errorMessage.textContent = "";

                successMessage.textContent = "";


                // ===============================
                // VALIDATION
                // ===============================

                if (password.length < 8) {

                    errorMessage.textContent =
                        "Password must contain at least 8 characters.";

                    return;
                }


                if (!/[A-Z]/.test(password)) {

                    errorMessage.textContent =
                        "Password must contain at least one uppercase letter.";

                    return;
                }


                if (!/[0-9]/.test(password)) {

                    errorMessage.textContent =
                        "Password must contain at least one number.";

                    return;
                }


                if (!/[^A-Za-z0-9]/.test(password)) {

                    errorMessage.textContent =
                        "Password must contain at least one special character.";

                    return;
                }


                if (password !== confirmPassword) {

                    errorMessage.textContent =
                        "Passwords do not match.";

                    return;
                }


                // ===============================
                // DISABLE BUTTON
                // ===============================

                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating Account...";


                // ===============================
                // SUPABASE SIGN UP
                // ===============================

                try {

                    const { data, error } =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: password,

                            options: {

                                data: {

                                    full_name: name

                                }

                            }

                        });


                    // ===============================
                    // HANDLE ERROR
                    // ===============================

                    if (error) {

                        throw error;

                    }


                    // ===============================
                    // SUCCESS
                    // ===============================

                    errorMessage.textContent = "";

                    successMessage.textContent =
                        "Account created successfully! Please check your email and verify your account.";


                    // Clear form

                    document.getElementById("signupForm")
                        .reset();


                    // Reset password requirement display

                    document.getElementById("length")
                        .textContent =
                        "○ At least 8 characters";


                    document.getElementById("uppercase")
                        .textContent =
                        "○ One uppercase letter";


                    document.getElementById("number")
                        .textContent =
                        "○ One number";


                    document.getElementById("special")
                        .textContent =
                        "○ One special character";


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    errorMessage.textContent =
                        error.message ||
                        "Unable to create account. Please try again.";

                } finally {

                    signupButton.disabled = false;

                    signupButton.textContent =
                        "✨ Create Account";

                }

            });


    </script>


</body>

</html>
